name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      version_override:
        description: 'Explicit version override (e.g. 1.0.1). Leave empty for auto increment.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ─── 1. Detect & Bump Version ────────────────────────────────────────────────
  version-and-tag:
    name: Auto Detect & Bump Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calculate Next Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.version_override }}" != "" ]; then
            VER="${{ inputs.version_override }}"
          else
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ]; then
              VER="1.0.0"
            else
              CLEAN_TAG="${LATEST_TAG#v}"
              MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
              MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
              PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)

              BUMP="${{ inputs.bump_type }}"
              if [ "$BUMP" == "minor" ]; then
                MINOR=$((MINOR + 1))
                PATCH=0
              elif [ "$BUMP" == "major" ]; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
              VER="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "release_version=$VER" >> $GITHUB_OUTPUT
          echo "tag_name=v$VER" >> $GITHUB_OUTPUT
          echo "::notice ::Auto-Detected Version: $VER (Tag: v$VER)"

      - name: Sync Version Across All Files
        run: |
          node ./scripts/sync-version.js ${{ steps.version.outputs.release_version }}

      - name: Commit & Push Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json frontend/package.json src-tauri/tauri.conf.json Cargo.toml src-tauri/nsis/generated_branding.nsh src-tauri/scripts/linux-post-install.sh || true
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.release_version }} [skip ci]" || echo "No changes to commit"
          git tag -f ${{ steps.version.outputs.tag_name }} || true
          git push origin main --tags || echo "Push skipped or already up to date"

  # ─── 2. Build for All Platforms & Directly Upload to GitHub Releases ─────────
  # NOTE: 0% GitHub Actions Storage Used!
  # Instead of using actions/upload-artifact (which consumes Actions Storage),
  # each runner directly uploads its binaries to GitHub Releases.
  build-and-release:
    name: Build & Release (${{ matrix.platform.target }})
    needs: version-and-tag
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Version
        run: node ./scripts/sync-version.js ${{ needs.version-and-tag.outputs.release_version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install NPM Dependencies (Safe npm install)
        run: |
          npm install
          cd frontend && npm install

      - name: Build Tauri Application
        run: |
          npx tauri build --target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundles }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release_assets
          BUNDLE_DIR="src-tauri/target/${{ matrix.platform.target }}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;
          fi
          cd release_assets
          ls -la
          sha256sum * > SHA256SUMS.txt || true

      - name: Direct Upload to GitHub Release (0% Action Storage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-and-tag.outputs.tag_name }}
          name: NovaVM ${{ needs.version-and-tag.outputs.tag_name }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
