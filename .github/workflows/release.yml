name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      version_override:
        description: 'Explicit version override (e.g. 1.0.1). Leave empty for auto increment.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ─── 1. Detect & Bump Version ────────────────────────────────────────────────
  version-and-tag:
    name: Auto Detect & Bump Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Calculate Next Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.version_override }}" != "" ]; then
            VER="${{ inputs.version_override }}"
          else
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ]; then
              VER="1.0.0"
            else
              CLEAN_TAG="${LATEST_TAG#v}"
              MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
              MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
              PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)

              BUMP="${{ inputs.bump_type }}"
              if [ "$BUMP" == "minor" ]; then
                MINOR=$((MINOR + 1))
                PATCH=0
              elif [ "$BUMP" == "major" ]; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
              VER="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "release_version=$VER" >> $GITHUB_OUTPUT
          echo "tag_name=v$VER" >> $GITHUB_OUTPUT
          echo "::notice ::Auto-Detected Version: $VER (Tag: v$VER)"

      - name: Sync Version Across All Files
        run: |
          node ./scripts/sync-version.js ${{ steps.version.outputs.release_version }}

      - name: Commit & Push Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json frontend/package.json src-tauri/tauri.conf.json Cargo.toml src-tauri/nsis/generated_branding.nsh src-tauri/scripts/linux-post-install.sh || true
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.release_version }} [skip ci]" || echo "No changes to commit"
          git tag -f ${{ steps.version.outputs.tag_name }} || true
          git push origin main --tags || echo "Push skipped or already up to date"

      - name: Generate Professional Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(gh release list --limit 2 --json tagName --jq '.[1].tagName' 2>/dev/null || echo "v1.0.1")
          VER="${{ steps.version.outputs.release_version }}"
          TAG="${{ steps.version.outputs.tag_name }}"
          COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"

          cat << 'EOF' | sed 's/^          //' > RELEASE_NOTES.md
          # NovaVM Release Notes 🚀

          We are excited to announce NovaVM! This release brings expanded cross-platform architecture support for **Linux ARM64** and **Windows ARM64**, key hypervisor kernel stability improvements across KVM and WHP backends, zero compiler warnings, and improved automated multi-platform release bundle packaging.

          ---

          ## 🌟 Key Highlights & Feature Changes

          ### 🖥️ Expanded Architecture Support
          - **Linux ARM64 (`aarch64-unknown-linux-gnu`):** Added full native Debian (`.deb`) and AppImage bundle targets with GCC cross-compilation pipeline support.
          - **Windows ARM64 (`aarch64-pc-windows-msvc`):** Added native ARM64 Windows NSIS installer setup generation.
          - **Universal Multi-Platform Coverage:** NovaVM now builds native packages across 6 major target architectures (Linux x86_64/ARM64, Windows x86_64/ARM64, macOS Intel/Apple Silicon).

          ### ⚡ Hypervisor & Engine Improvements
          - **Linux KVM Backend:** Fixed mutable `VcpuFd` borrow contract inside `kvm_vcpu_thread` (`vcpu.run()`), ensuring robust hardware-assisted execution on Linux hosts.
          - **Null Backend & Test Suite:** Synchronized `CreateVmRequest` parameter fields across test fixtures (`id: Option<Uuid>`).
          - **Code Hygiene:** Cleaned encoding mojibake/corrupted UTF-8 box characters across `kvm.rs`, `whp.rs`, `qemu.rs`, and `null.rs`.
          - **Warning-Free Compilation:** Resolved unused import (`FramebufferFrame`) and platform-conditional parameter warnings in `send_vm_input`.

          ### 📦 Release Pipeline & Packaging
          - **Automatic Workspace Bundle Discovery:** Fixed bundle resolution for root Cargo workspace builds (`target/release/bundle/`).
          - **Clean Release Generation:** Optimized CI workflow to generate release notes once per tag without duplicated changelog blocks across parallel matrix jobs.

          ---

          ## 💾 Download & Installation Packages

          | Platform | Architecture | Package Format | Binary File |
          | :--- | :--- | :--- | :--- |
          | **Windows** | `x86_64` (64-bit) | MSI Installer / NSIS Setup | `NovaVM_*_x64-setup.exe` |
          | **Windows** | `aarch64` (ARM64) | NSIS Setup | `NovaVM_*_arm64-setup.exe` |
          | **Linux** | `x86_64` (64-bit) | Debian Package / AppImage | `NovaVM_*_amd64.deb`, `NovaVM_*_amd64.AppImage` |
          | **Linux** | `aarch64` (ARM64) | Debian Package / AppImage | `NovaVM_*_arm64.deb`, `NovaVM_*_arm64.AppImage` |
          | **macOS** | `x86_64` (Intel) | Disk Image / App Bundle | `NovaVM_*_x64.dmg` |
          | **macOS** | `aarch64` (Apple Silicon) | Disk Image / App Bundle | `NovaVM_*_aarch64.dmg` |
          EOF

      - name: Create GitHub Release Object
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag_name }}" \
            --title "NovaVM ${{ steps.version.outputs.tag_name }}" \
            --notes-file RELEASE_NOTES.md \
            --draft=false \
            --prerelease=false || echo "Release object already exists"

  # ─── 2. Build for All Platforms & Directly Upload to GitHub Releases ─────────
  # NOTE: 0% GitHub Actions Storage Used!
  # Instead of using actions/upload-artifact (which consumes Actions Storage),
  # each runner directly uploads its binaries to GitHub Releases.
  build-and-release:
    name: Build & Release (${{ matrix.platform.target }})
    needs: version-and-tag
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app

    runs-on: ${{ matrix.platform.os }}
    env:
      APP_VERSION: ${{ needs.version-and-tag.outputs.release_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync Version
        run: node ./scripts/sync-version.js ${{ needs.version-and-tag.outputs.release_version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.platform.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo dpkg --add-architecture arm64
            CODENAME=$(lsb_release -cs 2>/dev/null || echo "noble")
            # Restrict main Ubuntu mirrors to amd64/i386 and point arm64 to ports.ubuntu.com
            sudo sed -i 's/^deb http/deb [arch=amd64,i386] http/' /etc/apt/sources.list 2>/dev/null || true
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            fi
            cat << EOF | sed 's/^            //' | sudo tee /etc/apt/sources.list.d/arm64-ports.list
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse
            EOF
            sudo apt-get update
            sudo apt-get install -y \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              libgtk-3-dev:arm64 libwebkit2gtk-4.1-dev:arm64 libappindicator3-dev:arm64 \
              librsvg2-dev:arm64 patchelf libssl-dev:arm64 pkg-config
          else
            sudo apt-get update
            sudo apt-get install -y \
              libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
              librsvg2-dev patchelf libssl-dev pkg-config
          fi

      - name: Install NPM Dependencies (Safe npm install)
        run: |
          npm install
          cd frontend && npm install

      - name: Pre-build Frontend Web Assets
        run: |
          cd frontend && npm run build

      - name: Build Tauri Application
        run: |
          npx tauri build --target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundles }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: ${{ matrix.platform.target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release_assets
          # Search for all generated installer bundles in root target/ and src-tauri/target/
          find target src-tauri/target -path "*/release/bundle/*" -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \; 2>/dev/null || true

          cd release_assets
          ls -la
          ASSET_COUNT=$(ls -1 | wc -l)
          if [ "$ASSET_COUNT" -gt 0 ]; then
            sha256sum * > ../SHA256SUMS.txt 2>/dev/null || shasum -a 256 * > ../SHA256SUMS.txt || true
            if [ -s "../SHA256SUMS.txt" ]; then
              mv ../SHA256SUMS.txt ./SHA256SUMS.txt
            fi
          else
            echo "Warning: No release bundles found."
          fi

      - name: Direct Upload to GitHub Release (0% Action Storage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-and-tag.outputs.tag_name }}
          name: NovaVM ${{ needs.version-and-tag.outputs.tag_name }}
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
