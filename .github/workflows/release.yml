name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      version_override:
        description: 'Explicit version override (e.g. 1.1.0). Leave empty for auto increment.'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Determine Version ───────────────────────────────────────────────────────
  determine-version:
    name: Determine & Sync Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calculate Next Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.version_override }}" != "" ]; then
            VER="${{ inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${github_ref_name#v}"
          else
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ]; then
              VER="1.0.0"
            else
              CLEAN_TAG="${LATEST_TAG#v}"
              MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
              MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
              PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)

              BUMP="${{ inputs.bump_type }}"
              if [ "$BUMP" == "minor" ]; then
                MINOR=$((MINOR + 1))
                PATCH=0
              elif [ "$BUMP" == "major" ]; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
              VER="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "release_version=$VER" >> $GITHUB_OUTPUT
          echo "tag_name=v$VER" >> $GITHUB_OUTPUT
          echo "Calculated Version: $VER"
          echo "Tag Name: v$VER"

      - name: Sync Manifest Versions
        run: |
          node ./scripts/sync-version.js ${{ steps.version.outputs.release_version }}

  # ─── Build Release Packages for All Platforms ────────────────────────────────
  build-release:
    name: Build (${{ matrix.platform.os }} - ${{ matrix.platform.target }})
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Sync Version
        run: node ./scripts/sync-version.js ${{ needs.determine-version.outputs.release_version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform.target }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config rpm

      - name: Install workspace & frontend dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build Tauri Application
        run: |
          npx tauri build --target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundles }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Generate Checksums
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.platform.target }}/release/bundle/
          find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.tar.gz" \) -exec sha256sum {} + > CHECKSUMS.txt || true
          cat CHECKSUMS.txt || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novavm-${{ matrix.platform.target }}-${{ needs.determine-version.outputs.tag_name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/

  # ─── Create GitHub Release ───────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [determine-version, build-release]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Consolidate SHA256 Checksums
        run: |
          cd artifacts/
          find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag_name }}
          name: NovaVM ${{ needs.determine-version.outputs.tag_name }}
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
