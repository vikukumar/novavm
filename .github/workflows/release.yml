name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override release version (e.g. 1.0.1). Leave empty for auto-increment.'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  determine-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.version_override }}" != "" ]; then
            VER="${{ inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${github_ref_name#v}"
          else
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ]; then
              VER="1.0.0"
            else
              CLEAN_TAG="${LATEST_TAG#v}"
              MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
              MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
              PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)
              NEXT_PATCH=$((PATCH + 1))
              VER="${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
          fi
          echo "release_version=$VER" >> $GITHUB_OUTPUT
          echo "tag_name=v$VER" >> $GITHUB_OUTPUT
          echo "Release Version: $VER"
          echo "Tag Name: v$VER"

  build-release:
    name: Build (${{ matrix.platform.os }})
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,macos
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,macos

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config \
            rpm

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundles }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.platform.target }}/release/bundle/
          find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" \) -exec sha256sum {} + > CHECKSUMS.txt || true
          cat CHECKSUMS.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novavm-${{ matrix.platform.target }}-${{ needs.determine-version.outputs.tag_name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [determine-version, build-release]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Consolidate SHA256 Checksums
        run: |
          cd artifacts/
          find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag_name }}
          name: NovaVM ${{ needs.determine-version.outputs.tag_name }}
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
