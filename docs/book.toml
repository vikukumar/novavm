[book]
authors = ["NovaVM Contributors"]
language = "en"
multilingual = false
src = "src"
title = "NovaVM Documentation"

[build]
build-dir = "book"

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
site-url = "/"
git-repository-url = "https://github.com/vikukumar/novavm"
edit-url-template = "https://github.com/vikukumar/novavm/edit/main/docs/{path}"

[output.html.search]
enable = true
